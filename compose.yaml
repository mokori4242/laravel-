services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /backend
    ports:
      - "8000:80"
    volumes:
      - ./backend:/backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_NAME: ":80"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_DIR: /backend
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: kinti
      DB_USERNAME: kinti
      DB_PASSWORD: secret

  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: kinti
      POSTGRES_USER: kinti
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
