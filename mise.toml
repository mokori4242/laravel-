[tasks."docker:up"]
description = "Docker コンテナをバックグラウンドで起動する"
run = "docker compose up -d"

[tasks."docker:down"]
description = "Docker コンテナを停止して削除する"
run = "docker compose down --remove-orphans"

[tasks."docker:destroy"]
description = "Docker コンテナ、ネットワーク、ボリュームを削除する"
run = "docker compose down -v"

[tasks."php:shell"]
description = "php コンテナに入る"
run = "docker compose exec php bash"

[tasks."db:shell"]
description = "db コンテナに入る"
run = "docker compose exec db bash"

[tasks."db:psql"]
description = "db コンテナの PostgreSQL に接続する"
run = "docker compose exec db psql -U kinti -d kinti"

[tasks."php:migrate"]
description = "Laravel のマイグレーションを実行する"
run = "docker compose exec php php artisan migrate --force --ansi"

[tasks."php:test"]
description = "php コンテナで Laravel のテストを実行する"
run = "docker compose exec php php artisan test"

[tasks."php:pint"]
description = "php コンテナで Laravel Pint を実行する"
run = "docker compose exec php vendor/bin/pint --format agent"

[tasks."php:larastan"]
description = "php コンテナで Larastan を実行する"
run = "docker compose exec php vendor/bin/phpstan analyse --memory-limit=1G"

[tasks.init]
description = "Docker を起動し、Laravel の初期セットアップを実行する"
run = """
docker compose up -d --build
docker compose exec php composer install
docker compose exec php cp .env.example .env
docker compose exec php php artisan key:generate --ansi
docker compose exec php php artisan migrate --force --ansi
"""
